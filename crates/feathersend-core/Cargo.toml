[package]
name = "feathersend-core"
description = "FeatherSend backend: LocalSend interop, pairing, clipboard and resumable transfers"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
localsend.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
pem = "4"
sha2 = "0.11"
getrandom = "0.3"
unicode-normalization = "0.1"
png = "0.18"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
# Interface list for discovery restarts; the version the LocalSend core uses.
if-addrs = "0.15"

[dev-dependencies]
tempfile = "3"
# Captures log lines in tests; already in the tree through the LocalSend core.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
