name: Release

on:
  push:
    tags: ['v*']
  # Manual runs only build the packages (artifacts); they never publish.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      FS_TARGET_DIR: C:\fst
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned nightly, see rust-toolchain.toml)
        run: rustup toolchain install nightly-2026-10-28 --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: C:\fst
      - name: Tag matches version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: cargo xtask check-tag "$env:TAG"
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Builds, import check, installers, portable zips
        run: cargo xtask dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/*
          --draft --title "FeatherSend $TAG" --generate-notes
